name: test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Publishing a release on GitHub (with a new tag) also builds and attaches
  # the files, so a release can be cut without pushing a tag from git.
  release:
    types: [published]

# A release made on GitHub can fire both the tag push and the release event.
# Run them one after the other so the second only refreshes the files.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install build dependencies
        run: npm ci
      - name: Build
        run: node build.mjs
      - name: updates.json is committed and current
        run: git diff --exit-code updates.json
      - name: Firefox background logic
        run: node tests/firefox_background.mjs
      - name: Content script on fake paywall pages
        run: python tests/run_tests.py
      - name: Chromium extension end to end
        run: python tests/chromium_e2e.py
      - name: Mozilla add-on lint
        run: npx --yes addons-linter --self-hosted dist/unveil-firefox-*.xpi

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci
      - name: Build
        run: node build.mjs
      - name: Tag matches manifest version
        run: |
          VERSION=$(node -p "require('./chromium/manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match manifest $VERSION"; exit 1; }
      # Unlisted signing returns a signed .xpi without creating a public AMO
      # listing. The bundled cookie banner code means AMO wants the readable
      # source too, so the repo at this tag goes up with it for reviewers.
      # If the AMO secrets are missing, or Mozilla refuses to sign,
      # the release still goes out: the Firefox file is renamed -unsigned and
      # the run carries a warning, so the Chrome build is never held back.
      - name: Sign Firefox build
        id: sign
        if: env.AMO_JWT_ISSUER != ''
        continue-on-error: true
        run: |
          git archive --format=zip -o dist/unveil-source.zip HEAD
          npx --yes web-ext sign --channel unlisted \
            --source-dir dist/firefox --artifacts-dir dist/signed \
            --upload-source-code dist/unveil-source.zip \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp dist/signed/*.xpi "dist/unveil-firefox-$VERSION.xpi"
      - name: Label an unsigned Firefox build
        if: steps.sign.outcome != 'success'
        run: |
          mv "dist/unveil-firefox-$VERSION.xpi" "dist/unveil-firefox-$VERSION-unsigned.xpi"
          echo "::warning title=Firefox build is unsigned::Signing was skipped or refused (outcome: ${{ steps.sign.outcome }}). The .xpi installs only as a temporary add-on or in Firefox Developer Edition."
      - name: Publish GitHub release
        run: |
          FILES="dist/unveil-chromium-$VERSION.zip $(ls dist/unveil-firefox-$VERSION*.xpi)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "Unveil $VERSION" --generate-notes
          fi
